# Cyber Digest sources. Verified Sept 2026.
# format:   rss (default) | json_kev  (CISA KEV catalog, JSON — RSS was retired May 2025)
# weight:   importance multiplier (1.0 = normal).
# tier:     news | advisory | intel        -> affects SCORING (advisory gets a bonus)
# category: advisories | intel | health | news  -> affects DISPLAY GROUPING (section)
#           if omitted, category falls back to tier.

brand:
  name: Cindera
  tagline: Your group's threat brief

sources:
  # ---- General cybersecurity news (stable RSS) ----
  - {name: BleepingComputer,  url: "https://www.bleepingcomputer.com/feed/",            tier: news, category: news, weight: 1.0}
  - {name: The Hacker News,   url: "https://thehackernews.com/feeds/posts/default?max-results=50", tier: news, category: news, weight: 1.2}
  - {name: Krebs on Security, url: "https://krebsonsecurity.com/feed/",                 tier: news, category: news, weight: 1.1}
  - {name: The Record,        url: "https://therecord.media/feed/",                     tier: news, category: news, weight: 1.0}
  - {name: SecurityWeek,      url: "https://www.securityweek.com/feed/",                tier: news, category: news, weight: 0.9}
  - {name: Dark Reading,      url: "https://www.darkreading.com/rss.xml",               tier: news, category: news, weight: 0.9}
  - {name: Infosecurity Mag,  url: "https://www.infosecurity-magazine.com/rss/news/",   tier: news, category: news, weight: 0.9}
  - {name: Cyber Security News, url: "https://cybersecuritynews.com/feed/",             tier: news, category: news, weight: 1.0}
  - {name: SecurityOnline,    url: "https://securityonline.info/feed/",                 tier: news, category: news, weight: 0.9}

  # ---- Official advisories (authoritative, CVE-centric) ----
  # CISA "all advisories" RSS is still live; KEV/alerts RSS were retired -> KEV via JSON below.
  - {name: CISA Advisories,   url: "https://www.cisa.gov/cybersecurity-advisories/all.xml", tier: advisory, category: advisories, weight: 1.5}
  - {name: CISA ICS,          url: "https://www.cisa.gov/cybersecurity-advisories/ics-advisories.xml", tier: advisory, category: advisories, weight: 1.2}
  - {name: CISA KEV,          url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", tier: advisory, category: advisories, weight: 1.8, format: json_kev}
  - {name: Zero Day Initiative, url: "https://www.zerodayinitiative.com/rss/published/", tier: advisory, category: advisories, weight: 1.1}

  # ---- Vendor / threat-intel blogs (threat actor & campaign research) ----
  - {name: Google Threat Intel, url: "https://cloud.google.com/blog/topics/threat-intelligence/rss/", tier: intel, category: intel, weight: 1.2}
  - {name: Microsoft Security,   url: "https://www.microsoft.com/en-us/security/blog/feed/", tier: intel, category: intel, weight: 1.1}
  - {name: Cisco Talos,          url: "https://blog.talosintelligence.com/rss/",           tier: intel, category: intel, weight: 1.1}
  - {name: Palo Alto Unit 42,    url: "https://unit42.paloaltonetworks.com/feed/",         tier: intel, category: intel, weight: 1.1}
  - {name: CrowdStrike,          url: "https://www.crowdstrike.com/blog/feed",             tier: intel, category: intel, weight: 1.0}
  - {name: Check Point Research, url: "https://research.checkpoint.com/feed/",             tier: intel, category: intel, weight: 1.0}
  - {name: Google Project Zero,  url: "https://googleprojectzero.blogspot.com/feeds/posts/default", tier: intel, category: intel, weight: 1.2}
  - {name: Fortinet (FortiGuard), url: "https://feeds.feedburner.com/fortinet/blog/threat-research", tier: intel, category: intel, weight: 1.1}

  # ---- Healthcare breach / sector notifications ----
  - {name: HIPAA Journal,     url: "https://www.hipaajournal.com/feed/",                 tier: news, category: health, weight: 1.1}
  - {name: DataBreaches.net,  url: "https://www.databreaches.net/feed/",                 tier: news, category: health, weight: 1.0}
  - {name: HealthcareInfoSecurity, url: "https://www.healthcareinfosecurity.com/rss-feeds", tier: news, category: health, weight: 1.1}

# ---- Display grouping (sections shown under each Daily/Weekly/Monthly tab) ----
# Order here is the order sections appear. Each section takes its own top-N by score,
# so a busy advisories day can't bury the news or healthcare items.
display:
  sections:
    - {category: advisories, label: "CVE &amp; ADVISORIES"}
    - {category: intel,      label: "THREAT ACTOR / INTEL"}
    - {category: health,     label: "HEALTHCARE BREACHES"}
    - {category: news,       label: "OTHER NEWS"}
  section_limits: {advisories: 12, intel: 10, health: 8, news: 10}

priority_keywords: {critical: 3.0, high: 2.0, medium: 1.0}

keywords:
  critical: [actively exploited, zero-day, zero day, in the wild, emergency directive,
             known exploited, ransomware attack, mass exploitation, unauthenticated remote, rce]
  high: [critical vulnerability, cvss 9, cvss 10, patch now, data breach, supply chain,
         exploit released, proof of concept, poc, privilege escalation]
  medium: [vulnerability, phishing, malware, advisory, update available, patch]

# Items matching these (and not formal advisories) are routed to the HEALTHCARE section,
# so a hospital breach reported by a general-news source still lands in the right place.
health_keywords: [hospital, health system, healthcare, patient data, patient records,
                  phi, hipaa, medical center, medical group, clinic, health record,
                  ehr, electronic health record, ocr breach, health plan, pharmacy]

cvss_critical_threshold: 9.0
